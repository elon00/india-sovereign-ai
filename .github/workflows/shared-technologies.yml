name: Shared technology regressions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  runtime:
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -B -m unittest discover -s tests -p "test_shared_*.py" -v
      - run: python -B -m qmoosa_runtime --help
